<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>blush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f0e6e6;
      --text: #000000;
    }

    html, body {
      height: 100%;
      min-height: 100vh;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Cormorant', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Top-left fixed description panel ── */
    .panel-main {
      position: fixed;
      top: 0;
      left: 0;
      width: 50%;
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      align-items: flex-start;
    }

    .panel-main h1 {
      font-family: 'Cormorant', Georgia, serif;
      font-weight: 400;
      font-style: normal;
      font-size: 2rem;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .panel-main h1 em {
      font-style: italic;
    }

    /* ── Bottom pinned footer ── */
    .panel-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      background-color: var(--bg);
      box-shadow: 0.4rem 0.4rem 2rem 2.5rem var(--bg);
    }

    .footer-inner {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .footer-contact {
      display: flex;
      flex-direction: row;
      gap: 2rem;
    }

    .panel-footer a,
    .panel-footer span,
    .panel-footer label {
      font-family: 'Cormorant', Georgia, serif;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.1;
      color: var(--text);
      text-decoration: none;
    }

    .panel-footer a:hover {
      opacity: 0.6;
    }

    /* ── Mailing list label ── */
    .mailing-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mailing-list > label {
      font-family: 'Cormorant', Georgia, serif;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.1;
      display: block;
    }

    /* push sender's form offscreen, not display:none so it stays functional */
    .sender-form-field {
      position: absolute;
      left: -9999px;
      top: -9999px;
      visibility: hidden;
    }

    /* our own form */
    .ml-form {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 3px 0;
    }

    .ml-form input[type="email"] {
      font-family: 'Cormorant', Georgia, serif;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text);
      background: #ffffff;
      border: none;
      outline: none;
      padding: 1px 3px;
      margin: 0 0 2px 0;
      width: 10rem;
      border-radius: 0;
      -webkit-appearance: none;
      appearance: none;
    }

    .ml-form input[type="email"]::placeholder {
      color: var(--text);
      opacity: 0.4;
    }

    .ml-form button {
      font-family: 'Cormorant', Georgia, serif;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text);
      background: #ffffff;
      border: none;
      padding: 2px 5px;
      cursor: pointer;
      text-align: left;
      border-radius: 0;
      width: fit-content;
      -webkit-appearance: none;
      appearance: none;
    }

    .ml-form button:hover {
      opacity: 0.6;
    }

    .ml-status {
      font-family: 'Cormorant', Georgia, serif;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text);
      opacity: 0.7;
      min-height: 0.8rem;
      margin-top: 2px;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .panel-main {
        position: relative;
        width: 100%;
        min-height: auto;
        padding: 1rem 1rem 7rem;
      }

      .panel-main h1 {
        font-size: 1.1rem;
      }

      .panel-footer {
        padding: 0.75rem 1rem;
      }

      .footer-inner {
        flex-direction: column;
        gap: 0.6rem;
      }

      .footer-contact {
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="panel-main">
    <h1><em>blush</em> is a DIY publisher<br>based in Glasgow.</h1>
  </div>

  <div class="panel-footer">
    <div class="footer-inner">

      <div class="mailing-list">
        <label>mailing list</label>
        <div class="ml-form">
          <input type="email" id="ml-email" placeholder="your@email.com" autocomplete="email" />
          <button type="button" id="ml-submit">subscribe</button>
        </div>
        <div class="ml-status" id="ml-status"></div>
        <!-- sender.net form hidden offscreen -->
        <div style="text-align: left" class="sender-form-field" data-sender-form-id="epYp86"></div>
      </div>

      <div class="footer-contact">
        <a href="https://linktr.ee/blushtbc" target="_blank" rel="noopener">linktr.ee/blushtbc</a>
        <a href="https://instagram.com/blush_tbc" target="_blank" rel="noopener">@blush_tbc</a>
      </div>

    </div>
  </div>

  <script>
    (function (s, e, n, d, er) {
      s['Sender'] = er;
      s[er] = s[er] || function () {
        (s[er].q = s[er].q || []).push(arguments)
      }, s[er].l = 1 * new Date();
      s[er].on = function(event, callback) {
        s[er].listeners = s[er].listeners || {};
        (s[er].listeners[event] = s[er].listeners[event] || []).push(callback);
      };
      var a = e.createElement(n),
          m = e.getElementsByTagName(n)[0];
      a.async = 1;
      a.src = d;
      m.parentNode.insertBefore(a, m)
    })(window, document, 'script', 'https://cdn.sender.net/accounts_resources/universal.js', 'sender');
    sender('50d781924f9346')

    document.getElementById('ml-submit').addEventListener('click', function() {
      const ourEmail = document.getElementById('ml-email').value.trim();
      const status   = document.getElementById('ml-status');

      if (!ourEmail || !ourEmail.includes('@')) {
        status.textContent = 'please enter a valid email.';
        return;
      }

      // find the hidden sender.net form's email input and submit button
      const senderField   = document.querySelector('.sender-form-field');
      const senderInput   = senderField && senderField.querySelector('input[type="email"], input[type="text"]');
      const senderButton  = senderField && senderField.querySelector('button[type="submit"], input[type="submit"], button');

      if (senderInput && senderButton) {
        // copy email in, fire native input event so their JS picks it up
        senderInput.value = ourEmail;
        senderInput.dispatchEvent(new Event('input', { bubbles: true }));
        senderInput.dispatchEvent(new Event('change', { bubbles: true }));
        senderButton.click();
        status.textContent = 'done.';
        document.getElementById('ml-email').value = '';
      } else {
        // fallback: sender form not loaded yet, retry once after a second
        status.textContent = '...';
        setTimeout(function() {
          const si = document.querySelector('.sender-form-field input[type="email"], .sender-form-field input[type="text"]');
          const sb = document.querySelector('.sender-form-field button[type="submit"], .sender-form-field input[type="submit"], .sender-form-field button');
          if (si && sb) {
            si.value = ourEmail;
            si.dispatchEvent(new Event('input', { bubbles: true }));
            si.dispatchEvent(new Event('change', { bubbles: true }));
            sb.click();
            status.textContent = 'done.';
            document.getElementById('ml-email').value = '';
          } else {
            status.textContent = 'something went wrong.';
          }
        }, 1000);
      }
    });

    document.getElementById('ml-email').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('ml-submit').click();
    });
  </script>

</body>
</html>
